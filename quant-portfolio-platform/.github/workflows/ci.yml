name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-and-api:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        # Tests use a throwaway SQLite database and the synthetic data generator,
        # so no network access and no services are needed.
        run: pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx next lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  postgres:
    name: API against PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quant
          POSTGRES_PASSWORD: quant
          POSTGRES_DB: quant_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev,postgres]"

      - name: Apply the schema from the committed DDL
        env:
          PGPASSWORD: quant
        run: psql -h localhost -U quant -d quant_test -f database/migrations/001_initial_schema.sql

      - name: Seed and smoke-test the API
        env:
          DATABASE_URL: postgresql://quant:quant@localhost:5432/quant_test
          JWT_SECRET: ci-secret-not-used-anywhere-else
          DATA_SOURCE: synthetic
          APP_ENV: test
        run: |
          python database/seed/seed.py
          python - <<'PY'
          import sys
          sys.path[:0] = [".", "backend"]
          from fastapi.testclient import TestClient
          from app.main import app

          with TestClient(app) as client:
              assert client.get("/health").status_code == 200
              status = client.get("/meta/data-status").json()
              assert status["assets"] > 0, status
              assert status["last_date"], status

              # A full round trip: guest account, portfolio, holding, analytics.
              assert client.post("/auth/demo").status_code == 200
              pid = client.get("/portfolios").json()[0]["id"]
              risk = client.post("/risk/metrics", json={"portfolio_id": pid}).json()
              assert risk["metrics"]["volatility"] > 0, risk
              opt = client.post("/portfolio/optimize", json={"portfolio_id": pid, "objective": "min_variance"}).json()
              assert abs(sum(opt["optimized"]["weights"].values()) - 1) < 1e-6, opt
              print("postgres smoke test passed")
          PY
