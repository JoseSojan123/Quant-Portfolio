[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-portfolio-engine"
version = "1.0.0"
description = "Framework-free quantitative engine: returns, risk, optimization, simulation, stress, rebalancing, backtesting."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11"]

[project.optional-dependencies]
# The HTTP layer. Installing the engine without this gives you a library you can
# drive from a notebook or a script with no web dependencies at all.
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0",
  "pydantic[email]>=2.6",
  "pydantic-settings>=2.2",
  "bcrypt>=4.1",
  "pyjwt>=2.8",
  "python-multipart>=0.0.9",
]
# Live market data. Optional because the synthetic generator needs no network.
data = ["yfinance>=0.2.40"]
# PostgreSQL driver, for DATABASE_URL=postgresql://...
postgres = ["psycopg[binary]>=3.1"]
dev = [
  "quant-portfolio-engine[api,data]",
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.4",
]

[project.urls]
Documentation = "https://github.com/your-username/quant-portfolio-platform#readme"

[tool.setuptools.packages.find]
include = ["quant*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = [".", "backend"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning"]

[tool.ruff]
line-length = 130
target-version = "py310"
exclude = ["frontend", ".venv", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["B008"]  # FastAPI's Depends() in a default argument is the documented idiom

[tool.ruff.lint.per-file-ignores]
"jobs/*" = ["E402"]            # sys.path is set up before the app imports
"database/seed/*" = ["E402"]
"quant/data/universe.py" = ["E501"]  # one line per asset keeps the universe table readable

[tool.ruff.lint.isort]
known-first-party = ["app", "quant"]
